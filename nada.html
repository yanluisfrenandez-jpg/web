  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var emailInput = document.getElementById('contact-email');
      var msgInput = document.getElementById('contact-message');
      var emailError = document.getElementById('contact-email-error');
      var msgError = document.getElementById('contact-message-error');
      var feedback = document.getElementById('contact-feedback');
      var feedbackText = document.getElementById('contact-feedback-text');

      form.addEventListener('submit', function (event) {
        var emailVal = emailInput.value.trim();
        var msgVal = msgInput.value.trim();
        var valid = true;

        if (!emailVal || emailVal.indexOf('@') === -1) {
          emailError.classList.remove('hidden');
          emailInput.setAttribute('aria-invalid', 'true');
          valid = false;
        } else {
          emailError.classList.add('hidden');
          emailInput.removeAttribute('aria-invalid');
        }

        if (!msgVal) {
          msgError.classList.remove('hidden');
          msgInput.setAttribute('aria-invalid', 'true');
          valid = false;
        } else {
          msgError.classList.add('hidden');
          msgInput.removeAttribute('aria-invalid');
        }

        if (!valid) {
          event.preventDefault();
        }
      });
    })();
  </script>
